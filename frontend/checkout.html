<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="Complete your HappyPaws order securely."
  >

  <meta
    name="author"
    content="HappyPaws"
  >

  <meta
    name="theme-color"
    content="#17351f"
  >

  <title>
    Checkout | HappyPaws
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>


<body>


  <!-- HEADER -->

  <header class="site-header">

    <a
      href="index.html"
      class="logo"
    >
      Happy<span>Paws</span>
    </a>


    <a
      href="index.html"
      class="nav-button"
    >
      Continue Shopping
    </a>

  </header>



  <!-- CHECKOUT -->

  <main class="section">

    <div class="section-heading">

      <div>

        <p class="eyebrow">
          HAPPYPAWS CHECKOUT
        </p>

        <h1>
          Complete your order.
        </h1>

      </div>

    </div>



    <div
      class="checkout-layout"
    >


      <!-- CUSTOMER INFORMATION -->

      <section
        class="checkout-card"
      >

        <h2>
          Customer information
        </h2>


        <form
          id="checkoutForm"
        >

          <div
            class="form-group"
          >

            <label
              for="customerName"
            >
              Full name
            </label>

            <input
              type="text"
              id="customerName"
              name="name"
              placeholder="John Doe"
              required
            >

          </div>


          <div
            class="form-group"
          >

            <label
              for="customerEmail"
            >
              Email address
            </label>

            <input
              type="email"
              id="customerEmail"
              name="email"
              placeholder="you@example.com"
              required
            >

          </div>


          <div
            class="form-group"
          >

            <label
              for="customerPhone"
            >
              Phone number
            </label>

            <input
              type="tel"
              id="customerPhone"
              name="phone"
              placeholder="+1 555 000 0000"
              required
            >

          </div>


          <h2>
            Shipping address
          </h2>


          <div
            class="form-group"
          >

            <label
              for="address"
            >
              Street address
            </label>

            <input
              type="text"
              id="address"
              name="address"
              placeholder="123 Main Street"
              required
            >

          </div>


          <div
            class="form-row"
          >

            <div
              class="form-group"
            >

              <label
                for="city"
              >
                City
              </label>

              <input
                type="text"
                id="city"
                name="city"
                required
              >

            </div>


            <div
              class="form-group"
            >

              <label
                for="state"
              >
                State
              </label>

              <input
                type="text"
                id="state"
                name="state"
                required
              >

            </div>

          </div>


          <div
            class="form-row"
          >

            <div
              class="form-group"
            >

              <label
                for="zip"
              >
                ZIP code
              </label>

              <input
                type="text"
                id="zip"
                name="zip"
                required
              >

            </div>


            <div
              class="form-group"
            >

              <label
                for="country"
              >
                Country
              </label>

              <select
                id="country"
                name="country"
                required
              >

                <option value="US">
                  United States
                </option>

                <option value="CA">
                  Canada
                </option>

              </select>

            </div>

          </div>


          <button
            type="submit"
            class="button button-primary"
          >
            Continue to secure payment
          </button>


          <p
            id="checkoutMessage"
          ></p>

        </form>

      </section>



      <!-- ORDER SUMMARY -->

      <aside
        class="checkout-card"
      >

        <h2>
          Your order
        </h2>


        <div
          id="checkoutItems"
        >

          Loading order...

        </div>


        <div
          class="checkout-total"
        >

          <span>
            Total
          </span>

          <strong
            id="checkoutTotal"
          >
            $0.00
          </strong>

        </div>

      </aside>


    </div>

  </main>



  <!-- FOOTER -->

  <footer>

    <p>
      © 2026 HappyPaws
    </p>

    <p>
      Built for pet lovers.
    </p>

  </footer>



  <script src="api.js"></script>

  <script src="checkout.js"></script>

</body>

</html>
